<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Định dạng văn bản với CSS</title>

    <style>
        h1 {
            font-size: 24px;
            text-align: center;
            color: blue;
        }

        p {
            font-size: 18px;
            text-indent: 30px;
            text-align: justify;
        }

        .italic {
            font-style: italic;
        }

        .red {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Định dạng văn bản với CSS</h1>

    <p>
        CSS là ngôn ngữ được sử dụng để định dạng và trình bày các trang web.
        CSS giúp thay đổi màu sắc, kích thước, kiểu chữ, căn chỉnh và nhiều
        thuộc tính khác của văn bản.
    </p>

    <p class="italic">
        Đây là đoạn văn được định dạng bằng kiểu chữ nghiêng.
    </p>

    <p class="red">
        Đây là đoạn văn có màu đỏ.
    </p>

</body>
</html>
